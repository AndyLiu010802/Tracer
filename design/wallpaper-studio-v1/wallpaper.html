<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracer · 动态壁纸</title><style>*{box-sizing:border-box}body{margin:0;background:#101925;color:#fff;font:13px 'Segoe UI','Microsoft YaHei',sans-serif}canvas{position:fixed;width:100vw;height:100vh}nav{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:12px 20px;border:1px solid #ffffff30;background:#09111caa;border-radius:12px;backdrop-filter:blur(20px);white-space:nowrap}a{color:#ddd;text-decoration:none}button{color:#fff;background:transparent;border:1px solid #ffffff40;padding:5px 10px;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}span{color:#d7d7d7}@media(max-width:500px){nav{gap:10px;font-size:11px;padding:10px}}</style></head><body><canvas id="canvas" aria-label="动态壁纸"></canvas><nav><a href="index.html">← 收藏馆</a><span id="name"></span><button id="pause">暂停</button></nav><script src="catalog.js"></script><script src="../../skins/tracer/wallpaper-motion.js"></script><script>
const item=WALLPAPERS.find(x=>x.id===location.hash.slice(1)&&x.type==='dynamic')||WALLPAPERS.find(x=>x.type==='dynamic');document.title='Tracer · '+item.name;document.getElementById('name').textContent=item.name;const player=TracerWallpaperMotion.player(document.getElementById('canvas'));player.set(item);let paused=false;const button=document.getElementById('pause');function update(){button.disabled=player.reduced;button.textContent=player.reduced?'已减少动态':paused?'播放':'暂停';}button.onclick=()=>{paused=!paused;player.pause(paused);update();};matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',update);update();
</script></body></html>
