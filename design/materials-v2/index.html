<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracer · 材质光学实验室</title>
<link rel="stylesheet" href="../../skins/tracer/wallpaper-shop.css"><link rel="stylesheet" href="../../skins/tracer/wallpaper-materials.css">
<link rel="stylesheet" href="../../skins/tracer/material-preview.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1114;color:#e5e9ea;font:14px 'Segoe UI',system-ui,sans-serif}main{max-width:1180px;margin:auto;padding:48px 30px}header{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:30px}.eyebrow{letter-spacing:3px;font-size:10px;color:#a7bcc4}h1{font-size:36px;font-weight:500;letter-spacing:-1px;margin:12px 0}p{color:#9facb4;line-height:1.8}button{font:inherit;color:inherit;border:1px solid #34404a;background:#192129;padding:10px 18px;border-radius:7px;cursor:pointer}button[aria-pressed=true]{background:#d9e8ec;color:#16242b;border-color:#d9e8ec}#controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}#hero{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;box-shadow:0 25px 100px #0008}#hero .material-optical-sample{border-width:36px}#hero .wallpaper-sample-top{font-size:21px}#hero .wallpaper-sample-cards>div{font-size:19px}#hero .wallpaper-sample-cards small{font-size:9px;margin-bottom:9px}#hero .wallpaper-sample-side{font-size:24px;line-height:2.5}#info{display:flex;align-items:baseline;gap:28px;border-bottom:1px solid #27323b;padding:16px 0}#info h2{font-weight:500;font-size:22px;white-space:nowrap}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:30px}.tile{padding:0;overflow:hidden;text-align:left}.thumb{position:relative;aspect-ratio:16/10;overflow:hidden}.tile strong{display:block;padding:12px;font-size:12px;font-weight:500}footer{color:#647780;font-size:11px;margin-top:26px;line-height:1.8}@media(max-width:700px){main{padding:24px 15px}h1{font-size:27px}header{display:block}#grid{grid-template-columns:repeat(2,1fr)}#info{display:block}#hero .material-optical-sample{border-width:20px}#hero .wallpaper-sample-top{font-size:11px}#hero .wallpaper-sample-cards>div{font-size:10px}#hero .wallpaper-sample-cards small{font-size:6px;margin-bottom:3px}}
</style>
<main><header><div><div class="eyebrow">TRACER / MATERIAL STUDIES 02</div><h1>光落下，材质才有了表情。</h1><p>移动鼠标，观察切面的光泽、纹理与折射。</p></div><button id="pause">暂停光效</button></header><div id="hero"></div><div id="controls"><button data-scene="01" aria-pressed="true">极光映照</button><button data-scene="05">海面映照</button><button data-scene="08">暖光映照</button></div><div id="info"><h2 id="name"></h2><p id="description"></p></div><div id="grid"></div><footer>实时材质渲染 · 水晶边缘采样壁纸模拟折射与色散；金属与木材使用各自的表面光照。支持减少动态效果。</footer></main>
<script src="../../skins/tracer/wallpaper-optics.js"></script><script>
const materials=[['glass','冰晶切面','透明切面折射背景，冷暖环境色在棱边汇合。'],['titanium','钛银工坊','细密拉丝、机械倒角与方向性反光。'],['walnut','胡桃书房','起伏木纹、细孔与凹槽，漆面映出温暖的光。'],['obsidian','曜石鎏金','抛光深色石面，嵌入一道香槟金。'],['porcelain','白瓷青釉','柔和凸起与温润釉面。'],['linen','燕麦织物','细密经纬交织成低光泽布面。'],['velvet','莓红丝绒','细绒表面与柔软的边缘光泽。'],['paper','宣纸墨边','细纤维与层叠纸边。'],['cyber','霓虹电路','冷色金属面与青色发光嵌线。'],['celadon','青竹茶席','细密竹纹与浅绿色漆面。']];
let selected='glass',scene='01',dispose=()=>{},paused=false;const hero=document.querySelector('#hero');
const url=()=>new URL('../../skins/tracer/wallpapers/dynamic-'+scene+'-v2.png',location.href).href;
function render(){dispose();hero.replaceChildren();const item=materials.find(m=>m[0]===selected);dispose=TracerMaterialOptics.preview(hero,selected,true,url());dispose.pause(paused);document.querySelector('#name').textContent=item[1];document.querySelector('#description').textContent=item[2];document.querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',b.dataset.material===selected));}
for(const [id,name] of materials){const b=document.createElement('button');b.className='tile';b.dataset.material=id;b.innerHTML='<div class="thumb wallpaper-card-image"></div><strong></strong>';b.querySelector('strong').textContent=name;document.querySelector('#grid').append(b);TracerMaterialOptics.preview(b.firstChild,id);b.onclick=()=>{selected=id;render();};}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;document.querySelectorAll('[data-scene]').forEach(n=>n.setAttribute('aria-pressed',n===b));render();});document.querySelector('#pause').onclick=e=>{paused=!paused;dispose.pause(paused);e.target.textContent=paused?'恢复光效':'暂停光效';};render();
</script></html>
