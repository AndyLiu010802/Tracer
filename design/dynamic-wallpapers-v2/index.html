<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracer · 流动的光</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101512;color:#e5ebdd;font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}main{width:min(1440px,94vw);margin:32px auto 60px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}small{color:#aab79d;letter-spacing:3px;font-size:10px}h1{font-size:30px;font-weight:500;letter-spacing:2px;margin:8px 0}header p{font-size:12px;color:#9fae98;margin:0}.edition{border:1px solid #60734c;padding:5px 13px;border-radius:20px;font-size:11px;color:#bfd2a5}.scene{position:relative;border:1px solid #536448;border-radius:14px;overflow:hidden;background:#101923}.scene>canvas{width:100%;height:min(70vh,800px);display:block;object-fit:cover}.scene:fullscreen{border:0;border-radius:0}.scene:fullscreen canvas{height:100vh}.scene:fullscreen .controls{position:absolute;bottom:0;left:0;right:0;background:#101512d9}.controls{padding:17px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px}.controls h2{font-size:18px;font-weight:500;margin:0}.controls p{font-size:11px;color:#a7b799;margin:0}.actions{display:flex;gap:8px}button{font:inherit;color:#dbe8cb;background:#293824;border:1px solid #5c7049;border-radius:6px;padding:6px 12px;cursor:pointer}button:focus-visible{outline:2px solid #d5e6bf;outline-offset:3px}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:27px}.tile{border:1px solid #35482c;border-radius:9px;padding:0;overflow:hidden;background:#172014;text-align:left}.tile[aria-pressed=true]{border-color:#d2e3b5;box-shadow:0 0 0 1px #d2e3b5}.tile canvas{display:block;width:100%;aspect-ratio:8/5}.tile span{display:block;padding:9px 12px;font-size:12px}.tile b{font-size:10px;color:#95a585;margin-right:9px;font-weight:400}footer{font-size:11px;color:#8f9f86;margin-top:20px}@media(max-width:750px){main{margin-top:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}h1{font-size:24px}.edition{display:none}.scene>canvas{height:48vh}.controls{padding:13px;flex-wrap:wrap}.controls p{max-width:240px}.actions{margin-left:auto}}
</style></head><body><main><header><div><small>TRACER / MOTION STUDIES</small><h1>流动的光</h1><p>微尘、丝线与光雾，十种安静的流动。</p></div><span class="edition">粒子系列 · 10 款</span></header>
<section class="scene" id="scene"><canvas id="hero" aria-label="动态壁纸预览"></canvas><div class="controls"><div><h2 id="name"></h2><p id="description"></p></div><div class="actions"><button id="pause">暂停</button><button id="fullscreen">全屏预览</button></div></div></section><div class="grid" id="grid"></div><footer>选择下方场景切换预览 · 支持方向键 · 遵循系统减少动态效果设置</footer></main>
<script src="catalog.js"></script><script src="../../skins/tracer/wallpaper-motion.js"></script><script>
const hero=document.getElementById('hero'),player=TracerWallpaperMotion.player(hero),grid=document.getElementById('grid');let selected=0,paused=false;
function select(index){selected=(index+DYNAMIC_SCENES.length)%DYNAMIC_SCENES.length;const item=DYNAMIC_SCENES[selected];player.set(item);document.getElementById('name').textContent=item.name;document.getElementById('description').textContent=item.style;grid.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===selected)));}
DYNAMIC_SCENES.forEach((item,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';b.setAttribute('aria-label','预览 '+item.name);b.dataset.id=item.id;const c=document.createElement('canvas');c.width=640;c.height=400;b.append(c);const name=document.createElement('span'),id=document.createElement('b');id.textContent=item.id.toUpperCase();name.append(id,document.createTextNode(item.name));b.append(name);b.onclick=()=>select(i);grid.append(b);TracerWallpaperMotion.draw(c,item,4);});
const pause=document.getElementById('pause');function status(){pause.disabled=player.reduced;pause.textContent=player.reduced?'已减少动态':paused?'播放':'暂停';}pause.onclick=()=>{paused=!paused;player.pause(paused);status();};matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',status);document.getElementById('fullscreen').onclick=()=>{const scene=document.getElementById('scene');if(document.fullscreenElement)document.exitFullscreen();else scene.requestFullscreen();};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')select(selected+1);if(e.key==='ArrowLeft')select(selected-1);});select(0);status();
</script></body></html>
