<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>Tracer · 饵料盒</title>
  <link rel="stylesheet" href="/fishing-bait-desktop.css">
</head>
<body>
  <main id="bait-box" aria-label="桌面饵料盒">
    <div class="box-shadow" aria-hidden="true"></div>
    <div class="box-side" aria-hidden="true"></div>
    <header class="box-lid">
      <div class="lid-inlay" aria-hidden="true"><span>⌁</span></div>
      <div class="lid-copy"><h1 id="box-title">饵料盒</h1><p id="box-hint">右键鱼饵 · 购买或装备</p></div>
      <div class="box-wallet" aria-label="金币"><i aria-hidden="true"></i><b id="box-coins">—</b></div>
      <button id="box-close" type="button" aria-label="收起饵料盒" title="收起饵料盒">×</button>
      <i class="hinge hinge-left" aria-hidden="true"></i><i class="hinge hinge-right" aria-hidden="true"></i>
    </header>
    <section class="box-tray" aria-labelledby="box-title">
      <div id="bait-slots"></div>
      <i class="corner corner-tl" aria-hidden="true"></i><i class="corner corner-tr" aria-hidden="true"></i>
      <i class="corner corner-bl" aria-hidden="true"></i><i class="corner corner-br" aria-hidden="true"></i>
    </section>
    <footer class="box-front">
      <div class="box-status"><span id="box-message" role="status" aria-live="polite">正在读取饵料…</span><button id="box-retry" type="button" hidden>重试保存</button></div>
      <span class="front-latch" aria-hidden="true"><i></i></span>
    </footer>
  </main>
  <script src="/fishing-pond-skins.js"></script>
  <script src="/fishing-bait-desktop.js"></script>
</body>
</html>
