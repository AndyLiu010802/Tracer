<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 标签页伪装：Studio 风格的「{project} | Supabase」标题 + 绿色闪电 favicon -->
<title>podmatrix | Supabase</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M9.2 1.2 3.1 8.9c-.4.5 0 1.2.6 1.2h4.1v4.7c0 .7.9 1 1.3.4l6.1-7.7c.4-.5 0-1.2-.6-1.2H10.5V1.6c0-.7-.9-1-1.3-.4z' fill='%233ecf8e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/skin.css">
<link rel="stylesheet" href="/farm.css">
</head>
<body>

<header class="top">
  <div class="top-left">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 16 16"><path d="M9.2 1.2 3.1 8.9c-.4.5 0 1.2.6 1.2h4.1v4.7c0 .7.9 1 1.3.4l6.1-7.7c.4-.5 0-1.2-.6-1.2H10.5V1.6c0-.7-.9-1-1.3-.4z"/></svg>
    </span>
    <span class="crumb">podmatrix</span>
    <span class="crumb-sep">/</span>
    <span class="crumb crumb-strong">production</span>
    <span class="pill">Free</span>
  </div>
  <div class="top-mid"></div>
  <div class="top-right">
    <span class="env"><span class="dot"></span>Connected</span>
    <button class="ghost">Feedback</button>
    <span class="avatar" title="Signed in">YL</span>
  </div>
</header>

<div class="shell">

  <!-- 图标竖栏：每个图标切换一个分区。data-sec 与 content.js 的 SECTIONS 对应。 -->
  <nav class="ic-rail" aria-label="Sections">
    <a class="ic" data-sec="home" title="Home"><svg viewBox="0 0 16 16"><path d="M2 6.5 8 2l6 4.5V14H9.5v-4h-3v4H2z"/></svg></a>
    <a class="ic" data-sec="tables" title="Table Editor"><svg viewBox="0 0 16 16"><path d="M2 2h12v12H2zM2 6h12M6 6v8"/></svg></a>
    <a class="ic" data-sec="sql" title="SQL Editor"><svg viewBox="0 0 16 16"><path d="m3 4 4 4-4 4M8.5 12H13"/></svg></a>
    <a class="ic" data-sec="database" title="Database"><svg viewBox="0 0 16 16"><ellipse cx="8" cy="3.5" rx="5" ry="1.8"/><path d="M3 3.5v9c0 1 2.2 1.8 5 1.8s5-.8 5-1.8v-9"/><path d="M3 8c0 1 2.2 1.8 5 1.8S13 9 13 8"/></svg></a>
    <a class="ic" data-sec="auth" title="Authentication"><svg viewBox="0 0 16 16"><path d="M8 1.5 13 3v4c0 3.5-2 6-5 7.5C5 13 3 10.5 3 7V3z"/></svg></a>
    <a class="ic" data-sec="storage" title="Storage"><svg viewBox="0 0 16 16"><path d="M2 4.5 4 3h8l2 1.5V13H2z"/><path d="M2 4.5h12"/></svg></a>
    <a class="ic" data-sec="queues" title="Queues"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg></a>
    <a class="ic ic-foot" data-sec="settings" title="Project Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4"/></svg></a>
  </nav>

  <nav class="side" id="side" aria-label="Section navigation"></nav>

  <main class="main" id="main"></main>

  <aside class="rail">
    <div class="rail-block rail-def">
      <div class="rail-label" id="rail-label">Definition</div>
      <div class="definition" id="definition"></div>
    </div>
    <!-- 小窗挂载点。data-panel-* 是可选的皮肤级文案：
         在 Supabase 语境下，「i18n 种子语料」比「本地化 fixtures」更贴切。 -->
    <div class="rail-block" id="aside-slot"
         data-panel-tag="zh_CN"
         data-panel-title="Seed samples"
         data-panel-meta="seed zh_CN &middot; utf8"></div>
  </aside>

</div>

<script src="/fishing.js"></script>
<script src="/combat.js"></script>
<script src="/equip.js"></script>
<script src="/mining.js"></script>
<script src="/magic.js"></script>
<script src="/farm.js"></script>
<script src="/content.js"></script>
</body>
</html>
